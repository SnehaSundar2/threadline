<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falcon Fashion</title>
<meta name="description" content="Falcon Fashion – premium men's t-shirts.">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html,body{height:100%;margin:0}
  body{background:radial-gradient(ellipse at 50% 70%,#2d2d30 0%,#0c0c0d 72%);color:#f3efe6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  main{height:100%;display:flex;flex-direction:column;align-items:center;padding:2vh 16px 3vh;box-sizing:border-box}
  .logo{flex:0 0 auto;animation:rise 1s ease both}
  .logo img{display:block;height:min(30vh,300px);width:auto;max-width:86vw;filter:drop-shadow(0 16px 30px rgba(0,0,0,.6));transition:filter .4s}
  .logo:hover img{filter:drop-shadow(0 16px 40px rgba(212,160,23,.4))}
  .stage{position:relative;flex:1 1 auto;width:min(720px,100%);min-height:0}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;-webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent 100%);mask-image:linear-gradient(to bottom,#000 80%,transparent 100%)}
  .bubble{position:absolute;left:50%;top:0;transform:translate(-50%,10px) scale(.9);opacity:0;pointer-events:none;
    background:#f3efe6;color:#141414;padding:12px 20px;border-radius:18px;font-weight:700;font-size:clamp(15px,2.4vw,20px);white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.4s cubic-bezier(.2,1.4,.4,1)}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:16px;height:16px;background:inherit;transform:translateX(-50%) rotate(45deg)}
  .bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
  .actions{flex:0 0 auto;display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .btn{font:600 13px/1 inherit;letter-spacing:.25em;text-transform:uppercase;text-decoration:none;cursor:pointer;
    color:#d4a017;background:transparent;border:1px solid #d4a017;padding:14px 28px;border-radius:99px;transition:.25s}
  .btn:hover,.btn.primary{background:#d4a017;color:#0c0c0d}
  .btn.primary:hover{background:#f0c040}
  @keyframes rise{from{opacity:0;transform:translateY(-14px)}}
  @media (prefers-reduced-motion:reduce){.logo{animation:none}}
</style>
</head>
<body>
<main>
  <a class="logo" href="shop.html" aria-label="Enter Falcon Fashion"><img src="logo.png" alt="Falcon Fashion"></a>
  <div class="stage">
    <canvas id="scene" aria-label="3D character waving hello"></canvas>
    <div class="bubble" id="bubble">Hello! Welcome to Falcon Fashion 👋</div>
  </div>
  <div class="actions">
    <button class="btn" id="hear" type="button">🔊 Hear greeting</button>
    <a class="btn primary" href="shop.html">Enter</a>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="guy.js"></script>
</body>
</html>
