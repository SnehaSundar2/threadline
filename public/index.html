<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falcon Fashion</title>
<meta name="description" content="Falcon Fashion – premium men's t-shirts.">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html,body{height:100%;margin:0}
  body{background:radial-gradient(ellipse at center,#2a2a2c 0%,#0c0c0d 75%);display:grid;place-items:center;overflow:hidden}
  a.splash{display:flex;flex-direction:column;align-items:center;gap:28px;padding:24px;text-decoration:none;animation:rise 1.2s ease both}
  a.splash img{width:min(760px,88vw);height:auto;filter:drop-shadow(0 20px 40px rgba(0,0,0,.6));transition:transform .5s,filter .5s}
  a.splash:hover img{transform:scale(1.03);filter:drop-shadow(0 20px 50px rgba(212,160,23,.35))}
  .enter{font:600 13px/1 system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#d4a017;border:1px solid #d4a017;padding:14px 30px;border-radius:99px;transition:.25s}
  a.splash:hover .enter{background:#d4a017;color:#0c0c0d}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}}
  @media (prefers-reduced-motion:reduce){a.splash{animation:none}}
</style>
</head>
<body>
  <a class="splash" href="shop.html" aria-label="Enter Falcon Fashion">
    <img src="logo.png" alt="Falcon Fashion">
    <span class="enter">Enter</span>
  </a>
</body>
</html>
